{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block body %}
<h1>Change password</h1>
<form method="post" class="panel" style="max-width:420px">{{ csrf() }}
  <p><label>Current password</label><input type="password" name="current" required></p>
  <p><label>New password (min 8)</label><input type="password" name="new" required minlength="8"></p>
  <button>Change password</button>
</form>
{% endblock %}
