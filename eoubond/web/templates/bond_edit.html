{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block body %}
<h1>Edit bond {{ bond.bond_no }}</h1>
<p class="sub">Changing the amount (e.g. an enhanced bond) moves the balance by the same difference. Every change is recorded in the audit trail.</p>
<form method="post" action="{{ url_for('main.bond_view', bond_id=bond.id) }}" class="panel">{{ csrf() }}
  <div class="grid">
    <div><label>Bond amount (₹)</label><input name="bond_amount" value="{{ bond.bond_amount }}"></div>
    <div><label>Valid from</label><input type="date" name="valid_from" value="{{ bond.valid_from.isoformat() }}"></div>
    <div><label>Valid to</label><input type="date" name="valid_to" value="{{ bond.valid_to.isoformat() }}"></div>
    <div><label>Status</label><select name="status">{% for s in ('ACTIVE','CLOSED') %}<option {{ 'selected' if bond.status==s }}>{{ s }}</option>{% endfor %}</select></div>
    <div style="grid-column: span 2"><label>Remarks</label><input name="remarks" value="{{ bond.remarks or '' }}"></div>
  </div>
  <div class="actions"><button>Save</button><a href="{{ url_for('main.bonds') }}">Cancel</a></div>
</form>
{% endblock %}
